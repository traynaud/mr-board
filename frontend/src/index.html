<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MR Board</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Anti-flash (RG-018-05) : lit la même clé que THEME_STORAGE_KEY
         (frontend/src/app/core/theme/theme-storage.ts) — un import est
         impossible ici, ce script s'exécute avant tout bundle JS. Garder les
         deux synchronisés en cas de renommage. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mrboard.theme.v1');
          var theme = raw === 'light' || raw === 'dark' ? raw : null;
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          // localStorage indisponible : reste en mode système (aucun attribut posé), RG-018-05.
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
