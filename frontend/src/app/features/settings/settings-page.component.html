<div class="settings-page">
  <mat-toolbar class="settings-toolbar">
    <a
      mat-icon-button
      routerLink="/"
      [queryParams]="boardQueryParams()"
      [attr.aria-label]="'common.back' | translate"
      [matTooltip]="'common.back' | translate"
    >
      <mat-icon svgIcon="arrow-left" />
    </a>
    <span class="nav-brand">{{ 'settings.title' | translate }}</span>
    <span class="spacer"></span>
    <button mat-button type="button" class="cancel" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
    @if (!store.loadError()) {
      <button mat-button type="button" class="reset" (click)="resetToDefaults()">
        {{ 'settings.reset.button' | translate }}
      </button>
      <button mat-flat-button type="button" class="save" [disabled]="!canSave()" (click)="save()">
        {{ 'common.save' | translate }}
      </button>
    }
  </mat-toolbar>

  @if (store.loading()) {
    <mat-progress-bar mode="indeterminate" class="loading" />
  } @else if (store.loadError(); as errorKey) {
    <div class="load-error" role="alert">
      <mat-icon svgIcon="alert-circle" />
      <span>{{ 'settings.loadError' | translate }} {{ errorKey | translate }}</span>
      <button mat-stroked-button type="button" class="retry" (click)="retry()">
        {{ 'common.retry' | translate }}
      </button>
    </div>
  } @else if (store.settings(); as settings) {
    <form class="settings-grid" [formGroup]="form">
      <app-settings-section
        [number]="'settings.me.number' | translate"
        titleKey="settings.me.title"
        descriptionKey="settings.me.description"
      >
        <app-me-section [form]="form" [identities]="identityRows()" />
      </app-settings-section>
      <app-settings-section
        id="connections"
        [number]="'settings.connections.number' | translate"
        titleKey="settings.connections.title"
        descriptionKey="settings.connections.description"
      >
        <app-connections-section />
      </app-settings-section>
      <app-settings-section
        [number]="'settings.projects.number' | translate"
        titleKey="settings.projects.title"
        descriptionKey="settings.projects.description"
      >
        <app-repositories-section [rows]="repoRows()" />
      </app-settings-section>
      <app-settings-section
        [number]="'settings.refresh.number' | translate"
        titleKey="settings.refresh.title"
        descriptionKey="settings.refresh.description"
      >
        <app-refresh-section [form]="form" />
      </app-settings-section>
      <app-settings-section
        [number]="'settings.thresholds.number' | translate"
        titleKey="settings.thresholds.title"
        descriptionKey="settings.thresholds.description"
      >
        <app-thresholds-section [form]="form" />
      </app-settings-section>
      <app-settings-section
        [number]="'settings.misc.number' | translate"
        titleKey="settings.misc.title"
        descriptionKey="settings.misc.description"
        [last]="true"
      >
        <app-miscellaneous-section [form]="form" />
      </app-settings-section>
    </form>
  }
</div>
