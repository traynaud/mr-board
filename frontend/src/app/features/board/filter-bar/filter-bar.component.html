<mat-chip-listbox multiple [attr.aria-label]="'board.filters.ariaLabel' | translate" class="filter-chips">
  <mat-chip-option [selected]="drafts()" (selectionChange)="$event.isUserInput && draftsToggle.emit()">
    {{ 'board.filters.drafts' | translate }}
  </mat-chip-option>

  @if (identityConfigured()) {
    <mat-chip-option [selected]="mine()" (selectionChange)="$event.isUserInput && mineToggle.emit()">
      <mat-icon svgIcon="user" matChipAvatar />
      {{ 'board.filters.mine' | translate }}
    </mat-chip-option>
  } @else {
    <span [matTooltip]="'board.filters.mineDisabledTooltip' | translate">
      <mat-chip-option disabled [selected]="false">
        <mat-icon svgIcon="user" matChipAvatar />
        {{ 'board.filters.mine' | translate }}
      </mat-chip-option>
    </span>
  }
</mat-chip-listbox>

<span class="separator"></span>

<mat-form-field class="search-field" appearance="outline" subscriptSizing="dynamic">
  <input
    matInput
    [ngModel]="search()"
    (ngModelChange)="searchChange.emit($event)"
    [placeholder]="'board.filters.searchPlaceholder' | translate"
    [attr.aria-label]="'board.filters.searchPlaceholder' | translate"
    maxlength="100"
  />
  @if (search().length > 0) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="clearSearch()"
      [attr.aria-label]="'board.filters.searchClear' | translate"
    >
      <mat-icon svgIcon="x" />
    </button>
  }
</mat-form-field>

<span class="filter-pills">
  @for (key of active(); track key) {
    <app-filter-pill
      [filterKey]="key"
      [options]="optionsFor(key)"
      [multiSelected]="multiValueFor(key)"
      [booleanSelected]="booleanValueFor(key)"
      [projects]="projects()"
      (toggleValue)="filterToggleValue.emit({ key, value: $event })"
      (selectBoolean)="filterSelectBoolean.emit({ key, value: $event })"
      (remove)="filterRemove.emit(key)"
    />
  }
  <app-add-filter-menu
    [active]="active()"
    [showConnectionFilter]="showConnectionFilter()"
    (addFilter)="filterAdd.emit($event)"
  />
</span>

<span class="spacer"></span>

<span class="summary">
  <span class="count">{{ countLabel() }}</span>
  @if (hasActiveFilter()) {
    <button mat-button type="button" (click)="clearFilters.emit()">
      {{ 'board.filters.clear' | translate }}
    </button>
  }
</span>
